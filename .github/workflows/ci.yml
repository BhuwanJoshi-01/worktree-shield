name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Git discovery, config parsing and policy are platform-neutral; runtime
          # process inspection is only claimed for Linux.
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  sarif:
    # The SARIF report of the example repository is validated against the official
    # schema, fetched from the OASIS repository at a pinned commit and checksummed.
    runs-on: ubuntu-latest
    env:
      SCHEMA_URL: https://raw.githubusercontent.com/oasis-tcs/sarif-spec/a560296ca8c921f3bdb8d4a8db57ab83dae968a7/sarif-2.1/schema/sarif-schema-2.1.0.json
      SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Build the example and write its SARIF report
        run: |
          uv run python examples/conflicting-worktrees/build.py "$RUNNER_TEMP/demo"
          uv run worktree-shield report --repo "$RUNNER_TEMP/demo/app" --scope static \
            --format sarif --output "$RUNNER_TEMP/demo.sarif"
      - name: Fetch the SARIF 2.1.0 schema
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sarif-schema.json" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/sarif-schema.json" | sha256sum -c -
      - name: Validate
        run: uv run python scripts/check_sarif.py "$RUNNER_TEMP/sarif-schema.json" "$RUNNER_TEMP/demo.sarif"
