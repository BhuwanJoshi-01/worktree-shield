name: ${PROJECT:-shop}
services:
  web:
    image: nginx
    container_name: shop-web
    ports:
      - "${WEB_PORT:-8080}:80"
      - "127.0.0.1:8443:443"
      - "9229"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - /srv/shop/uploads:/uploads
      - /etc/ssl/certs:/certs:ro
  db:
    image: postgres:17
    ports:
      - target: 5432
        published: "${DB_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: volume
        source: shared-cache
        target: /cache
  worker:
    image: app
    container_name: ${WORKER_NAME}
    ports: ["${METRICS_PORT}:9100", "not:a:port:at:all"]
volumes:
  pgdata: {}
  shared-cache:
    external: true
