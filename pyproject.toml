[project]
name = "worktree-shield"
version = "0.1.0"
description = "Audit parallel Git worktrees for shared ports, databases and Docker resources before your agents collide."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BhuwanJoshi-01", email = "bhuwanj779@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worktree-shield = "worktree_shield:main"
wtshield = "worktree_shield:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib
    "S",            # bandit: subprocesses and secret handling must be deliberate
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
