[project]
name = "worktree-shield"
version = "0.1.0"
description = "Audit parallel Git worktrees for shared ports, databases and Docker resources before your agents collide."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BhuwanJoshi-01", email = "bhuwanj779@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["git", "worktree", "ai-agents", "docker-compose", "ports", "sarif", "ci", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://bhuwanjoshi-01.github.io/worktree-shield/"
Documentation = "https://github.com/BhuwanJoshi-01/worktree-shield/blob/main/docs/cli.md"
Source = "https://github.com/BhuwanJoshi-01/worktree-shield"
Issues = "https://github.com/BhuwanJoshi-01/worktree-shield/issues"
Changelog = "https://github.com/BhuwanJoshi-01/worktree-shield/blob/main/CHANGELOG.md"

[project.scripts]
worktree-shield = "worktree_shield.cli:main"
wtshield = "worktree_shield.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib
    "S",            # bandit: subprocesses and secret handling must be deliberate
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["worktree_shield", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S104",  # bind addresses such as 0.0.0.0 are test data, nothing binds them
    "S105", "S106",  # fake secrets are the point of the redaction tests
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["worktree_shield"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
